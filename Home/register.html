<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TRIP VOL VOL</title>
    <link rel="shortcut icon" href="../img/image.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Style/register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-7 d-none d-lg-block p-0 left-side">
            <img src="../img/image.png" alt="TRIP VOL VOL">
            <div class="overlay"></div>
            <div class="quote-box">
                <h2> Precision in every service, luxury in every detail. </h2>
                <p>Elevate your establishment's operational flow with our integrated management ecosystem. </p>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="register-wrapper">
                <div class="register-card">
                    <div class="text-center mb-4">
                        <div class="logo">
                            <div class="pic-logo">
                                <img src="../img/image.png" alt="TRIP VOL VOL">
                            </div>
                        </div>
                        <div class="brand-title"> TRIP VOL VOL </div>
                        <div class="brand-sub"> MANAGEMENT SUITE </div>
                    </div>
                    
                    <div class="text-center mb-4">
                        <h2 class="welcome-title"> Create account </h2>
                        <p class="welcome-text"> Register your account to access the management suite </p>
                    </div>

                    <!-- Alert Box សម្រាប់បង្ហាញ Error/Success Messages -->
                    <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

                    <form id="registerForm">
                        <!-- FULL NAME -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Full Name </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    placeholder="Enter your full name"
                                    required
                                >
                            </div>
                        </div>

                        <!-- EMAIL -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Email Address
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="tripvolvol@gmail.com"
                                    required
                                >
                            </div>
                        </div>

                        <!-- PASSWORD -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Password
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="••••••••"
                                    required
                                >
                                <span
                                    class="input-group-text toggle-password"
                                    onclick="togglePassword('password', 'eyeIcon')">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </span>
                            </div>
                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Confirm Password </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-shield-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                                <span class="input-group-text toggle-password" onclick="togglePassword('confirmPassword','confirmEyeIcon')">
                                    <i class="bi bi-eye" id="confirmEyeIcon"></i>                               
                                </span>
                            </div>
                        </div>

                        <!-- TERMS CHECKBOX -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms"> I agree to the
                                <a href="#" class="text-primary text-decoration-none fw-semibold"> Terms & Conditions </a>
                            </label>
                        </div>

                        <!-- REGISTER BUTTON -->
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 btn-register d-flex align-items-center justify-content-center text-white">
                            <span>Create Account</span>
                            <i class="bi bi-person-plus ms-2"></i>
                        </button>

                        <div class="text-center mt-4">
                            <span class="text-secondary">Already have an account? </span>
                            <a href="./logic.html" class="text-primary text-decoration-none fw-semibold ms-1">Login</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // SHOW / HIDE PASSWORD
    function togglePassword(inputId, iconId) {
        const password = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (password.type === "password") {
            password.type = "text";
            icon.className = "bi bi-eye-slash";
        } else {
            password.type = "password";
            icon.className = "bi bi-eye";
        }
    }

    // REGISTER FORM CONNECTION TO BACKEND
    document.getElementById("registerForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        // CHECK PASSWORD MATCH
        if (password !== confirmPassword) {
            alertBox.className = "alert alert-danger";
            alertBox.innerText = "Passwords do not match!";
            alertBox.classList.remove("d-none");
            return;
        }

        // CHECK PASSWORD LENGTH
        if (password.length < 6) {
            alertBox.className = "alert alert-danger";
            alertBox.innerText = "Password must be at least 6 characters!";
            alertBox.classList.remove("d-none");
            return;
        }

        // SET BUTTON LOADING STATE
        submitBtn.disabled = true;
        submitBtn.querySelector("span").innerText = "Creating Account...";

        try {
            // Send Request to Spring Boot Backend API
            const response = await fetch("http://localhost:8080/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: fullName,
                    email: email,
                    password: password
                })
            });

            if (response.ok) {
                alertBox.className = "alert alert-success";
                alertBox.innerText = "Account created successfully! Redirecting to login page...";
                alertBox.classList.remove("d-none");

                // REDIRECT TO LOGIN PAGE AFTER SUCCESS
                setTimeout(() => {
                    window.location.href = "./logic.html";
                }, 1500);

            } else {
                const errorMsg = await response.text();
                alertBox.className = "alert alert-danger";
                alertBox.innerText = errorMsg || "Registration failed! Email might already exist.";
                alertBox.classList.remove("d-none");
            }

        } catch (error) {
            console.error("Error:", error);
            alertBox.className = "alert alert-danger";
            alertBox.innerText = "Cannot connect to backend server. Make sure Spring Boot is running!";
            alertBox.classList.remove("d-none");
        } finally {
            submitBtn.disabled = false;
            submitBtn.querySelector("span").innerText = "Create Account";
        }
    });
</script>

</body>
</html>
