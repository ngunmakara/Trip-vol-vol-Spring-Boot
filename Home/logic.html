<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip VOL VOL Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="../img/image.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Style/login.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-7 d-none d-lg-block p-0 left-side">
                <img src="../img/image.png" alt="TRIP VOL VOL">
                <div class="overlay"></div>
                <div class="quote-box">
                    <h2>
                        Precision in every service, luxury in every detail.
                    </h2>
                    <p>
                        Elevate your establishment's operational flow with our
                        integrated management ecosystem.
                    </p>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="col-lg-5">
                <div class="login-wrapper">
                    <div class="login-card">

                        <div class="text-center mb-5">
                            <div class="logo">
                                <div class="pic-logo">
                                    <img src="../img/image.png" alt="TRIP VOL VOL">
                                </div>
                            </div>

                            <div class="brand-title">
                                TRIP VOL VOL
                            </div>

                            <div class="brand-sub">
                                MANAGEMENT SUITE
                            </div>
                        </div>

                        <div class="text-center mb-4">
                            <h2 class="welcome-title">
                                Welcome back
                            </h2>
                            <p class="welcome-text">
                                Enter your credentials to access the management suite
                            </p>
                        </div>

                        <!-- Alert Box សម្រាប់បង្ហាញ Error/Success Messages -->
                        <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <!-- EMAIL -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" id="email" class="form-control" placeholder="tripvolvol@gmail.com" required>
                                </div>
                            </div>

                            <!-- PASSWORD -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                    <span class="input-group-text toggle-password" onclick="togglePassword()">
                                        <i class="bi bi-eye" id="eyeIcon"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- OPTIONS -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none fw-semibold">
                                    Forgot password?
                                </a>
                            </div>

                            <!-- BUTTON -->
                            <button type="submit" id="loginBtn" class="btn btn-primary w-100 btn-login d-flex align-items-center justify-content-center text-white">
                                <span>Login</span>
                                <i class="bi bi-box-arrow-in-right ms-2"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">Don't have an account? <a href="./register.html" class="text-primary fw-semibold text-decoration-none">Sign Up</a></p>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                icon.className = "bi bi-eye-slash";
            } else {
                password.type = "password";
                icon.className = "bi bi-eye";
            }
        }

        // មុខងារ Handle Login ភ្ជាប់ទៅ Spring Boot API
        async function handleLogin(event) {
            event.preventDefault(); // ការពារ Refresh Page

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const loginBtn = document.getElementById('loginBtn');

            // បង្ហាញ Loading Status
            loginBtn.disabled = true;
            loginBtn.querySelector('span').innerText = 'Logging in...';

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: emailInput,
                        password: passwordInput
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // រក្សាទុក User data ក្នុង LocalStorage
                    localStorage.setItem('user', JSON.stringify(data));

                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Login successful! Redirecting...';
                    alertBox.classList.remove('d-none');

                    // បញ្ជូនទៅកាន់ Homepage បន្ទាប់ពី Login ជោគជ័យ
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 1000);

                } else {
                    const errorMsg = await response.text();
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerText = errorMsg || 'Login failed! Please check your credentials.';
                    alertBox.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = 'Cannot connect to backend server. Make sure Spring Boot is running!';
                alertBox.classList.remove('d-none');
            } finally {
                loginBtn.disabled = false;
                loginBtn.querySelector('span').innerText = 'Login';
            }
        }
    </script>

</body>

</html>
